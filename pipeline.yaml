trigger: none
pr: none

pool:
  name: Azure Pipelines
  vmImage: ubuntu-latest

variables:
- group: AWS

steps:

# ==========================================
# Checkout Repository
# ==========================================
- checkout: self


# ==========================================
# Test Pipeline
# ==========================================
- script: |
    echo "Azure DevOps pipeline is working"
  displayName: "Test Pipeline"


# ==========================================
# Test AWS Connection
# ==========================================
- script: |
    echo "Testing AWS connection..."
    aws sts get-caller-identity
  displayName: "Test AWS Connection"
  env:
    AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
    AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
    AWS_DEFAULT_REGION: $(AWS_REGION)


# ==========================================
# Install Terraform
# ==========================================
- script: |
    echo "Installing Terraform..."

    wget -q https://releases.hashicorp.com/terraform/1.13.3/terraform_1.13.3_linux_amd64.zip

    unzip -o terraform_1.13.3_linux_amd64.zip

    sudo mv terraform /usr/local/bin/terraform

    terraform version
  displayName: "Install Terraform"


# ==========================================
# Terraform Format Check
# ==========================================
- script: |
    echo "Checking Terraform formatting..."

    terraform fmt -check -recursive
  displayName: "Terraform Format Check"


# ==========================================
# Terraform Init
# ==========================================
- script: |
    echo "Initializing Terraform..."

    terraform init -input=false
  displayName: "Terraform Init"
  env:
    AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
    AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
    AWS_DEFAULT_REGION: $(AWS_REGION)


# ==========================================
# Terraform Validate
# ==========================================
- script: |
    echo "Validating Terraform configuration..."

    terraform validate
  displayName: "Terraform Validate"


# ==========================================
# Install TFLint
# ==========================================
- script: |
    echo "Installing TFLint..."

    curl -sSLO https://github.com/terraform-linters/tflint/releases/latest/download/tflint_linux_amd64.zip

    unzip -o tflint_linux_amd64.zip

    sudo install -c -v tflint /usr/local/bin/

    echo "TFLint version:"
    tflint --version
  displayName: "Install TFLint"


# ==========================================
# Terraform Code Analysis
# ==========================================
- script: |
    echo "Initialising TFLint..."

    tflint --init

    echo "Running Terraform code analysis..."

    tflint --recursive
  displayName: "Terraform Code Analysis - TFLint"


# ==========================================
# Terraform Plan
# ==========================================
- script: |
    echo "Creating Terraform plan..."

    terraform plan \
      -input=false \
      -out=tfplan
  displayName: "Terraform Plan"
  env:
    AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
    AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
    AWS_DEFAULT_REGION: $(AWS_REGION)


# ==========================================
# Terraform Apply
# ==========================================
- script: |
    echo "Applying Terraform configuration..."

    terraform apply \
      -input=false \
      -auto-approve \
      tfplan
  displayName: "Terraform Apply"
  env:
    AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
    AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
    AWS_DEFAULT_REGION: $(AWS_REGION)


# ==========================================
# Wait for EKS Cluster
# ==========================================
- script: |
    echo "Waiting for EKS cluster to become ACTIVE..."

    aws eks wait cluster-active \
      --name celonis-eks-dev \
      --region us-east-2

    echo "EKS cluster status:"

    aws eks describe-cluster \
      --name celonis-eks-dev \
      --region us-east-2 \
      --query 'cluster.status' \
      --output text
  displayName: "Wait for EKS Cluster"
  env:
    AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
    AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
    AWS_DEFAULT_REGION: $(AWS_REGION)


# ==========================================
# Install kubectl
# ==========================================
- task: KubectlInstaller@0
  displayName: "Install kubectl"
  inputs:
    kubectlVersion: 'latest'


# ==========================================
# Check kubectl
# ==========================================
- script: |
    echo "kubectl version:"

    kubectl version --client
  displayName: "Check kubectl"


# ==========================================
# Configure kubectl for EKS
# ==========================================
- script: |
    echo "Configuring kubeconfig for EKS..."

    aws eks update-kubeconfig \
      --region us-east-2 \
      --name celonis-eks-dev

    echo "Current Kubernetes context:"
    kubectl config current-context

    echo "EKS nodes:"
    kubectl get nodes -o wide

    echo "All Kubernetes pods:"
    kubectl get pods -A
  displayName: "Configure kubectl and Verify EKS"
  env:
    AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
    AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
    AWS_DEFAULT_REGION: $(AWS_REGION)