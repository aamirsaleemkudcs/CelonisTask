trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
- group: AWS

stages:

- stage: DatabaseFix
  displayName: "SonarQube Database Fix"

  jobs:

  - job: RunDatabaseFix
    displayName: "Run SonarQube DB Fixer"

    steps:

    # ==========================================
    # Checkout Repository
    # ==========================================
    - checkout: self


    # ==========================================
    # Test AWS Connection
    # ==========================================
    - script: |
        set -euo pipefail

        echo "Testing AWS connection..."
        aws sts get-caller-identity

      displayName: "Test AWS Connection"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_REGION)


    # ==========================================
    # Install Terraform
    # ==========================================
    - script: |
        set -euo pipefail

        echo "Installing Terraform..."

        wget -q \
          https://releases.hashicorp.com/terraform/1.13.3/terraform_1.13.3_linux_amd64.zip

        unzip -o terraform_1.13.3_linux_amd64.zip

        sudo mv terraform /usr/local/bin/terraform

        terraform version

      displayName: "Install Terraform"


    # ==========================================
    # Install kubectl
    # ==========================================
    - task: KubectlInstaller@0
      displayName: "Install kubectl"
      inputs:
        kubectlVersion: 'latest'


    # ==========================================
    # Connect to EKS
    # ==========================================
    - script: |
        set -euo pipefail

        echo "Connecting to EKS..."

        aws eks update-kubeconfig \
          --region us-east-2 \
          --name celonis-eks-dev

        echo ""
        echo "Current Kubernetes context:"
        kubectl config current-context

        echo ""
        echo "EKS nodes:"
        kubectl get nodes

      displayName: "Connect to EKS"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_REGION)


    # ==========================================
    # Initialise Terraform Infrastructure State
    # ==========================================
    - script: |
        set -euo pipefail

        echo "Initialising Terraform..."

        terraform init -input=false

        echo ""
        echo "Infrastructure state initialised."

      displayName: "Initialize Infrastructure State"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_REGION)


    # ==========================================
    # Prepare Secure Database Configuration
    # ==========================================
    - script: |
        set -euo pipefail

        echo "========================================"
        echo "Preparing Secure DB Configuration"
        echo "========================================"

        kubectl create namespace sonarqube \
          --dry-run=client \
          -o yaml | kubectl apply -f -

        echo ""
        echo "Reading RDS configuration from Terraform state..."

        RDS_ENDPOINT=$(terraform output -raw rds_endpoint)
        RDS_PORT=$(terraform output -raw rds_port)
        RDS_DATABASE=$(terraform output -raw rds_db_name)
        RDS_SECRET_ARN=$(terraform output -raw rds_master_secret_arn)

        # Handles both hostname and hostname:port formats.
        RDS_HOST="${RDS_ENDPOINT%%:*}"

        echo "Retrieving RDS credentials securely..."

        SECRET_JSON=$(aws secretsmanager get-secret-value \
          --secret-id "$RDS_SECRET_ARN" \
          --query SecretString \
          --output text)

        DB_USERNAME=$(echo "$SECRET_JSON" | jq -r '.username')
        DB_PASSWORD=$(echo "$SECRET_JSON" | jq -r '.password')

        unset SECRET_JSON

        if [ -z "$DB_USERNAME" ] || [ "$DB_USERNAME" = "null" ]; then
          echo "ERROR: Failed to retrieve database username."
          exit 1
        fi

        if [ -z "$DB_PASSWORD" ] || [ "$DB_PASSWORD" = "null" ]; then
          echo "ERROR: Failed to retrieve database password."
          exit 1
        fi

        echo ""
        echo "Creating/updating Kubernetes Secret..."

        kubectl create secret generic sonarqube-jdbc \
          --namespace sonarqube \
          --from-literal=jdbc-username="$DB_USERNAME" \
          --from-literal=jdbc-password="$DB_PASSWORD" \
          --dry-run=client \
          -o yaml | kubectl apply -f -

        unset DB_USERNAME
        unset DB_PASSWORD

        echo ""
        echo "Creating/updating database ConfigMap..."

        kubectl create configmap sonarqube-db-config \
          --namespace sonarqube \
          --from-literal=host="$RDS_HOST" \
          --from-literal=port="$RDS_PORT" \
          --from-literal=database="$RDS_DATABASE" \
          --dry-run=client \
          -o yaml | kubectl apply -f -

        echo ""
        echo "Database configuration prepared successfully."

      displayName: "Prepare Secure DB Configuration"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_REGION)


    # ==========================================
    # Verify Prerequisites
    # ==========================================
    - script: |
        set -euo pipefail

        echo "========================================"
        echo "Checking DB Fixer Prerequisites"
        echo "========================================"

        echo ""
        echo "Namespace:"
        kubectl get namespace sonarqube

        echo ""
        echo "Database Secret:"
        kubectl get secret sonarqube-jdbc \
          -n sonarqube

        echo ""
        echo "Database ConfigMap:"
        kubectl get configmap sonarqube-db-config \
          -n sonarqube

        echo ""
        echo "SonarQube:"
        kubectl get pods \
          -n sonarqube

      displayName: "Check DB Fixer Prerequisites"


    # ==========================================
    # Remove Previous DB Fixer Job
    # ==========================================
    - script: |
        set -euo pipefail

        echo "Removing previous DB Fixer Job if present..."

        kubectl delete job sonarqube-db-fixer \
          --namespace sonarqube \
          --ignore-not-found=true \
          --wait=true

      displayName: "Remove Previous DB Fixer Job"


    # ==========================================
    # Deploy DB Fixer
    # ==========================================
    - script: |
        set -euo pipefail

        echo "========================================"
        echo "Deploying SonarQube DB Fixer"
        echo "========================================"

        kubectl apply \
          -f kubernetes/db-fixer-job.yaml

        echo ""
        echo "Waiting for Job to complete..."

        if ! kubectl wait \
          --for=condition=complete \
          job/sonarqube-db-fixer \
          --namespace sonarqube \
          --timeout=300s
        then
          echo ""
          echo "ERROR: DB Fixer Job failed or timed out."

          echo ""
          echo "Job:"
          kubectl get job sonarqube-db-fixer \
            -n sonarqube || true

          echo ""
          echo "Pods:"
          kubectl get pods \
            -n sonarqube \
            -l job-name=sonarqube-db-fixer || true

          echo ""
          echo "Job logs:"
          kubectl logs \
            -n sonarqube \
            job/sonarqube-db-fixer || true

          exit 1
        fi

        echo ""
        echo "DB Fixer Job completed successfully."

      displayName: "Run DB Fixer"


    # ==========================================
    # Verify Results
    # ==========================================
    - script: |
        set -euo pipefail

        echo "========================================"
        echo "DB FIXER JOB"
        echo "========================================"

        kubectl get job sonarqube-db-fixer \
          -n sonarqube

        echo ""
        echo "========================================"
        echo "JOB POD"
        echo "========================================"

        kubectl get pods \
          -n sonarqube \
          -l job-name=sonarqube-db-fixer \
          -o wide

        echo ""
        echo "========================================"
        echo "JOB LOGS"
        echo "========================================"

        kubectl logs \
          -n sonarqube \
          job/sonarqube-db-fixer

        echo ""
        echo "========================================"
        echo "DAY-2 DATABASE OPERATION SUCCESSFUL"
        echo "========================================"

      displayName: "Verify Database Fix"