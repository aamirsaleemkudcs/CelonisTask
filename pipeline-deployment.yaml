trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
- group: AWS

stages:

- stage: ApplicationDeployment
  displayName: "SonarQube Application Deployment"

  jobs:

  - job: DeploySonarQube
    displayName: "Deploy SonarQube"

    steps:

    # ==========================================
    # Checkout
    # ==========================================
    - checkout: self


    # ==========================================
    # Test AWS Connection
    # ==========================================
    - script: |
        echo "Testing AWS connection..."
        aws sts get-caller-identity
      displayName: "Test AWS Connection"
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_REGION)


    # ==========================================
    # Install Terraform
    # ==========================================
    - script: |
        echo "Installing Terraform..."

        wget -q https://releases.hashicorp.com/terraform/1.13.3/terraform_1.13.3_linux_amd64.zip
        unzip -o terraform_1.13.3_linux_amd64.zip
        sudo mv terraform /usr/local/bin/terraform

        terraform version
      displayName: "Install Terraform"


    # ==========================================
    # Install kubectl
    # ==========================================
    - task: KubectlInstaller@0
      displayName: "Install kubectl"
      inputs:
        kubectlVersion: 'latest'


    # ==========================================
    # Install Helm
    # ==========================================
    - task: HelmInstaller@1
      displayName: "Install Helm"
      inputs:
        helmVersionToInstall: 'latest'


    # ==========================================
    # Verify Tools
    # ==========================================
    - script: |
        terraform version
        kubectl version --client
        helm version
      displayName: "Verify Deployment Tools"


    # ==========================================
    # Connect to EKS
    # ==========================================
    - script: |
        echo "Configuring EKS kubeconfig..."

        aws eks update-kubeconfig \
          --region us-east-2 \
          --name celonis-eks-dev

        echo "Current context:"
        kubectl config current-context

        echo "EKS nodes:"
        kubectl get nodes -o wide

        echo "Kubernetes system pods:"
        kubectl get pods -n kube-system
      displayName: "Connect to EKS"
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_REGION)


    # ==========================================
    # Read Infrastructure Terraform State
    # ==========================================
    - script: |
        echo "Initialising infrastructure state..."

        terraform init -input=false

        echo "Checking required infrastructure outputs..."

        terraform output -raw eks_cluster_name
        terraform output -raw rds_endpoint

        echo ""
        echo "Infrastructure state available."
      displayName: "Read Infrastructure State"
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_REGION)


    
    # ==========================================
    # Create SonarQube Kubernetes Secrets
    # ==========================================
    - bash: |
        set -euo pipefail
        set +x

        echo "Creating SonarQube namespace..."

        kubectl create namespace sonarqube \
          --dry-run=client \
          -o yaml | kubectl apply -f -

        echo "Checking Terraform state output..."

        if ! RDS_SECRET_ARN="$(terraform output -raw rds_master_secret_arn)"; then
          echo "ERROR: Cannot read rds_master_secret_arn."
          echo "Check Terraform backend, workspace and saved outputs."
          exit 1
        fi

        if [[ ! "$RDS_SECRET_ARN" =~ ^arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+ ]]; then
          echo "ERROR: Terraform did not return a valid Secrets Manager ARN."
          exit 1
        fi

        echo "RDS secret ARN validated."

        echo "Retrieving RDS credentials..."

        SECRET_JSON="$(aws secretsmanager get-secret-value \
          --secret-id "$RDS_SECRET_ARN" \
          --region "$AWS_DEFAULT_REGION" \
          --query SecretString \
          --output text)"

        if ! DB_PASSWORD="$(printf '%s' "$SECRET_JSON" | jq -er '.password | select(type == "string" and length > 0)')"; then
          echo "ERROR: RDS password missing from secret."
          exit 1
        fi

        unset SECRET_JSON

        if [[ -z "${SONAR_MONITORING_PASSCODE:-}" ]]; then
          echo "ERROR: SONAR_MONITORING_PASSCODE is missing."
          exit 1
        fi

        echo "Creating/updating SonarQube secrets..."

        create_or_replace_secret() {
          local name="$1"
          local key="$2"
          local value="$3"
          local manifest
          local version

          manifest="$(mktemp)"
          chmod 600 "$manifest"

          kubectl create secret generic "$name" \
            -n sonarqube \
            --from-literal="$key=$value" \
            --dry-run=client \
            -o json > "$manifest"

          if version="$(kubectl get secret "$name" \
            -n sonarqube \
            -o jsonpath='{.metadata.resourceVersion}' 2>/dev/null)"; then

            jq --arg rv "$version" \
              '.metadata.resourceVersion = $rv' \
              "$manifest" > "${manifest}.new"

            mv "${manifest}.new" "$manifest"
            kubectl replace -f "$manifest"
          else
            kubectl create -f "$manifest"
          fi

          rm -f "$manifest"
        }

        create_or_replace_secret \
          "sonarqube-jdbc" \
          "jdbc-password" \
          "$DB_PASSWORD"

        unset DB_PASSWORD

        create_or_replace_secret \
          "sonarqube-monitoring" \
          "monitoring-passcode" \
          "$SONAR_MONITORING_PASSCODE"

        echo "SonarQube secrets created successfully."

      workingDirectory: "$(Build.SourcesDirectory)"
      displayName: "Create SonarQube Secrets"
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_REGION)
        SONAR_MONITORING_PASSCODE: $(SONAR_MONITORING_PASSCODE)


    # ==========================================
    # Application Terraform Init
    # ==========================================
    - script: |
        terraform init -input=false
      workingDirectory: application
      displayName: "Application Terraform Init"
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_REGION)


    # ==========================================
    # Application Terraform Validate
    # ==========================================
    - script: |
        terraform validate
      workingDirectory: application
      displayName: "Application Terraform Validate"


    # ==========================================
    # Application Terraform Plan
    # ==========================================
    - script: |
        terraform plan \
          -input=false \
          -out=sonarqube.tfplan
      workingDirectory: application
      displayName: "SonarQube Terraform Plan"
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_REGION)


    # ==========================================
    # Deploy SonarQube
    # ==========================================
    - script: |
        terraform apply \
          -input=false \
          -auto-approve \
          sonarqube.tfplan
      workingDirectory: application
      displayName: "Deploy SonarQube with Helm"
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_REGION)


    # ==========================================
    # Verify SonarQube
    # ==========================================
    - script: |
        echo "========================================"
        echo "Helm Release"
        echo "========================================"

        helm list -n sonarqube

        echo ""
        echo "========================================"
        echo "SonarQube Pods"
        echo "========================================"

        kubectl get pods -n sonarqube -o wide

        echo ""
        echo "========================================"
        echo "SonarQube Services"
        echo "========================================"

        kubectl get services -n sonarqube

        echo ""
        echo "========================================"
        echo "SonarQube Pod Details"
        echo "========================================"

        kubectl describe pods -n sonarqube

      displayName: "Verify SonarQube Deployment"