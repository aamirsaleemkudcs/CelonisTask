trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
- group: AWS

stages:

- stage: ApplicationDeployment
  displayName: "SonarQube Application Deployment"

  jobs:

  - job: DeploySonarQube
    displayName: "Deploy SonarQube"

    steps:

    # ==========================================
    # Checkout
    # ==========================================
    - checkout: self


    # ==========================================
    # Test AWS Connection
    # ==========================================
    - script: |
        echo "Testing AWS connection..."
        aws sts get-caller-identity
      displayName: "Test AWS Connection"
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_REGION)


    # ==========================================
    # Install Terraform
    # ==========================================
    - script: |
        echo "Installing Terraform..."

        wget -q https://releases.hashicorp.com/terraform/1.13.3/terraform_1.13.3_linux_amd64.zip
        unzip -o terraform_1.13.3_linux_amd64.zip
        sudo mv terraform /usr/local/bin/terraform

        terraform version
      displayName: "Install Terraform"


    # ==========================================
    # Install kubectl
    # ==========================================
    - task: KubectlInstaller@0
      displayName: "Install kubectl"
      inputs:
        kubectlVersion: 'latest'


    # ==========================================
    # Install Helm
    # ==========================================
    - task: HelmInstaller@1
      displayName: "Install Helm"
      inputs:
        helmVersionToInstall: 'latest'


    # ==========================================
    # Verify Tools
    # ==========================================
    - script: |
        terraform version
        kubectl version --client
        helm version
      displayName: "Verify Deployment Tools"


    # ==========================================
    # Connect to EKS
    # ==========================================
    - script: |
        echo "Configuring EKS kubeconfig..."

        aws eks update-kubeconfig \
          --region us-east-2 \
          --name celonis-eks-dev

        echo "Current context:"
        kubectl config current-context

        echo "EKS nodes:"
        kubectl get nodes -o wide

        echo "Kubernetes system pods:"
        kubectl get pods -n kube-system
      displayName: "Connect to EKS"
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_REGION)


# ==========================================
# Read Infrastructure Terraform State
# ==========================================
    - script: |
        set -euo pipefail

        echo "Initialising infrastructure state..."

        terraform init -input=false

        echo "Checking infrastructure outputs..."

        terraform output -raw eks_cluster_name
        terraform output -raw rds_endpoint

        echo ""
        echo "Checking RDS master secret ARN..."

        RDS_SECRET_ARN="$(terraform output -raw rds_master_secret_arn)"

        if [[ -z "$RDS_SECRET_ARN" ]]; then
          echo "ERROR: RDS secret ARN is empty."
          exit 1
        fi

        echo "ARN length: ${#RDS_SECRET_ARN}"

        if [[ "$RDS_SECRET_ARN" == arn:aws:secretsmanager:* ]]; then
          echo "SUCCESS: RDS secret output has Secrets Manager ARN prefix."
        else
          echo "ERROR: RDS secret output is not an ARN."
          exit 1
        fi

        echo "Infrastructure state verification completed."

      displayName: "Read Infrastructure State"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_REGION)


 # ==========================================
# Create SonarQube Kubernetes Secrets
# ==========================================
    - script: |
        set -euo pipefail

        echo "Creating SonarQube namespace..."

        kubectl create namespace sonarqube \
          --dry-run=client \
          -o yaml | kubectl apply -f -

        echo "Retrieving RDS secret ARN..."

        RDS_SECRET_ARN="$(terraform output -raw rds_master_secret_arn)"
        RDS_SECRET_ARN="$(printf '%s' "$RDS_SECRET_ARN" | tr -d '\r\n')"

        if [[ -z "$RDS_SECRET_ARN" || "$RDS_SECRET_ARN" == "null" ]]; then
          echo "ERROR: Terraform returned an empty RDS secret ARN."
          exit 1
        fi

        if [[ ! "$RDS_SECRET_ARN" =~ ^arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@!-]+$ ]]; then
          echo "ERROR: Terraform output is not a valid Secrets Manager ARN."
          exit 1
        fi

        echo "Retrieving RDS password from Secrets Manager..."

        if ! SECRET_JSON="$(aws secretsmanager get-secret-value \
          --secret-id "$RDS_SECRET_ARN" \
          --region "$AWS_DEFAULT_REGION" \
          --query SecretString \
          --output text)"; then
          echo "ERROR: Unable to retrieve RDS secret."
          exit 1
        fi

        DB_PASSWORD="$(printf '%s' "$SECRET_JSON" | jq -er '.password')"
        unset SECRET_JSON

        if [[ -z "$DB_PASSWORD" ]]; then
          echo "ERROR: RDS password is empty."
          exit 1
        fi

        echo "Creating JDBC Kubernetes Secret..."

        kubectl create secret generic sonarqube-jdbc \
          --namespace sonarqube \
          --from-literal=jdbc-password="$DB_PASSWORD" \
          --dry-run=client \
          -o yaml | kubectl apply -f -

        unset DB_PASSWORD

        echo "Creating monitoring Kubernetes Secret..."

        if [[ -z "${SONAR_MONITORING_PASSCODE:-}" ]]; then
          echo "ERROR: Monitoring passcode is missing."
          exit 1
        fi

        kubectl create secret generic sonarqube-monitoring \
          --namespace sonarqube \
          --from-literal=monitoring-passcode="$SONAR_MONITORING_PASSCODE" \
          --dry-run=client \
          -o yaml | kubectl apply -f -

        echo "SonarQube secrets successfully created."

      displayName: "Create SonarQube Secrets"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_REGION)
        SONAR_MONITORING_PASSCODE: $(SONAR_MONITORING_PASSCODE)


    # ==========================================
    # Application Terraform Init
    # ==========================================
    - script: |
        terraform init -input=false
      workingDirectory: application
      displayName: "Application Terraform Init"
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_REGION)


    # ==========================================
    # Application Terraform Validate
    # ==========================================
    - script: |
        terraform validate
      workingDirectory: application
      displayName: "Application Terraform Validate"


    # ==========================================
    # Application Terraform Plan
    # ==========================================
    - script: |
        terraform plan \
          -input=false \
          -out=sonarqube.tfplan
      workingDirectory: application
      displayName: "SonarQube Terraform Plan"
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_REGION)


    # ==========================================
    # Deploy SonarQube
    # ==========================================
    - script: |
        terraform apply \
          -input=false \
          -auto-approve \
          sonarqube.tfplan
      workingDirectory: application
      displayName: "Deploy SonarQube with Helm"
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
        AWS_DEFAULT_REGION: $(AWS_REGION)


    # ==========================================
    # Verify SonarQube
    # ==========================================
    - script: |
        echo "========================================"
        echo "Helm Release"
        echo "========================================"

        helm list -n sonarqube

        echo ""
        echo "========================================"
        echo "SonarQube Pods"
        echo "========================================"

        kubectl get pods -n sonarqube -o wide

        echo ""
        echo "========================================"
        echo "SonarQube Services"
        echo "========================================"

        kubectl get services -n sonarqube

        echo ""
        echo "========================================"
        echo "SonarQube Pod Details"
        echo "========================================"

        kubectl describe pods -n sonarqube

      displayName: "Verify SonarQube Deployment"